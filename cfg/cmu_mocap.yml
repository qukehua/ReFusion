dataset: 'cmu_mocap'
predict_human_only: True  # Person 1 is the target; Person 2 supplies observed context
use_partner_condition: True
cmu_person_joint_num: 39
seed: 42
t_his: 25
t_pred: 100
batch_size: 32
eval_batch_size: 32
num_epoch: 100
milestone: [20, 40, 60, 80, 100]
save_model_interval: 20
num_data_sample: 50000
num_val_data_sample: 5000
lr: 3.e-4

n_pre: 100  # full P-frame future DCT spectrum (Eq. 8)
weight_decay: 0.01  # AdamW; explicitly disclosed implementation choice
adam_betas: [0.9, 0.999]
adam_eps: 1.e-8
# Evaluation constructs neighbors from loaded test windows; no legacy cache is read.
multimodal_path: null
data_candi_path: null
padding: 'LastFrame'
Complete: False  # observations are conditions only; no inpainting
noise_steps: 1000
ddim_timesteps: 100
scheduler: 'Cosine'
model_variant: 'two_stage'
stage1_num_layers: 2
dit_attn_mode: 'spatio_temporal'  # 'spatio_temporal' or 'self_attention'
num_layers: 9
num_heads: 8
latent_dims: 512
dropout: 0.2

# modulation settings
mod_train: 1.0  # always condition the Eq. (21) training objective
mod_test: 1.0
dct_norm_enable: False
disable_tensorboard: True
use_data_aug: True
aug_rotate_prob: 0.5
aug_reverse_prob: 0.3
use_velocity_input: False
velocity_loss_weight: 0.0

# visualization settings
vis_azim: 0.0
vis_elev: 15.0
vis_axis_radius: 2.5
vis_size: 3.0
vis_dpi: 80
vis_auto_axis: True
vis_axis_padding: 0.25
vis_line_width: 1.5
vis_title_fontsize: 16

# Recorded synchronized pairs only: train|test/<scene>/<pair>.npz.
# Each archive contains person_1 and person_2, both [frames, 39, 3] in meters.
# Single-person TXT files and generated partners are not accepted.
cmu_scene_filter: null
cmu_file_filter: null
cmu_total_joint_num: 78

data_path: '/data/user/qkh/datasets/cmu_mocap'
